# Manthan investigation agent.
#
# An ADK (Agent Development Kit) agent that drives Gemini (via AI Studio,
# default gemini-3.1-pro-preview) over the Coral SQL data plane (over MCP)
# to investigate billing disputes, draft replies, propose actions.
#
# Native A2A interop, Cloud Trace instrumentation, and ADK evals.

[project]
name = "manthan-agent"
version = "0.1.0"
description = "Manthan investigation agent over the Coral SQL plane."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hitakshi Arora", email = "hitakshi@miny-labs.com" },
    { name = "Akash Mondal", email = "akash@miny-labs.com" },
]

# Runtime dependencies. Keep this list tight.
dependencies = [
    "google-adk>=2.2",         # Apache-2.0 - Agent Development Kit (agent, tools, callbacks, A2A, eval)
    "google-genai>=2.8",       # Apache-2.0 - Gemini client (AI Studio)
    "mcp>=1.2.0",              # MIT  - Model Context Protocol stdio client (Coral)
    "pydantic>=2.7",           # MIT  - typed tool args + structured outputs
    "python-dotenv>=1.0",      # BSD  - loads .env into os.environ
    "anyio>=4.4",              # MIT  - async backend for mcp
    "rich>=13.7",              # MIT  - pretty console output
]

# Optional extras:
#   dev - test tooling (pure-logic pytest suite; no LLM calls)
#   gcp - Cloud Trace span exporter; tracing.setup_tracing() wires it when
#         GOOGLE_CLOUD_PROJECT is set, and stays a silent no-op without it.
[project.optional-dependencies]
dev = ["pytest>=8"]
gcp = ["opentelemetry-exporter-gcp-trace>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manthan_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length governed by formatter
